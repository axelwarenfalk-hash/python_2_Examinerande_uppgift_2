[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malmo-council-attendance"
version = "0.1.0"
description = "Tools for analyzing Malmö municipal council meeting attendance"
requires-python = ">=3.10"
dependencies = [
	"beautifulsoup4>=4.12",
	"matplotlib>=3.8,<4",
	"pandas>=2.0",
	"pdfplumber>=0.11",
	"requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
